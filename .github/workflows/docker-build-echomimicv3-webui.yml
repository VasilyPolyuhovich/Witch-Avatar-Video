name: Build EchoMimicV3 WebUI backend image

on:
  push:
    branches: [main]
    paths:
      - "docker/echomimicv3-webui/**"
      - ".github/workflows/docker-build-echomimicv3-webui.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  OWNER: vasilypolyuhovich

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/echomimicv3-webui
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/witch-avatar-echomimicv3-webui:latest
            ghcr.io/${{ env.OWNER }}/witch-avatar-echomimicv3-webui:sha-${{ github.sha }}
          cache-from: type=gha,scope=echomimicv3-webui
          cache-to: type=gha,mode=max,scope=echomimicv3-webui
