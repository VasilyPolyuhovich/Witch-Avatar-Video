name: Build MuseTalk Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/musetalk/**"
      - ".github/workflows/docker-build-musetalk.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires a lowercase owner path -- hardcode rather than lowercase
  # github.repository_owner at runtime.
  OWNER: vasilypolyuhovich

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No baked-in checkpoints in this image (see docker/musetalk/Dockerfile's
      # own comment on why), but the CUDA devel base + torch + MMLab stack
      # still run several GB; keep this step for the same reason
      # docker-build.yml has it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/musetalk
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/witch-avatar-musetalk:latest
            ghcr.io/${{ env.OWNER }}/witch-avatar-musetalk:sha-${{ github.sha }}
          cache-from: type=gha,scope=musetalk
          cache-to: type=gha,mode=max,scope=musetalk
