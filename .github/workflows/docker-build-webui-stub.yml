name: Build WebUI stub backend Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/webui-stub/**"
      - ".github/workflows/docker-build-webui-stub.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  OWNER: vasilypolyuhovich

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/webui-stub
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/witch-avatar-webui-stub:latest
            ghcr.io/${{ env.OWNER }}/witch-avatar-webui-stub:sha-${{ github.sha }}
          cache-from: type=gha,scope=webui-stub
          cache-to: type=gha,mode=max,scope=webui-stub
