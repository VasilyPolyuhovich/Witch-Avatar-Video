name: Build Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires a lowercase owner path -- hardcode rather than lowercase
  # github.repository_owner at runtime.
  OWNER: vasilypolyuhovich

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base image plus torch/checkpoints run several GB;
      # the default runner disk can overflow without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/sadtalker
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/witch-avatar-sadtalker:latest
            ghcr.io/${{ env.OWNER }}/witch-avatar-sadtalker:sha-${{ github.sha }}
          cache-from: type=gha,scope=sadtalker
          cache-to: type=gha,mode=max,scope=sadtalker
